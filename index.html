<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jenkins Pipeline Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="2"/>
          <path d="M8 12l3 3 5-6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">Jenkins<span class="logo-highlight">Watch</span></span>
      </div>
    </div>

    <div class="header-center">
      <div class="stat-chip" id="stat-total">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="count-total">0</span>
      </div>
      <div class="stat-chip running" id="stat-running">
        <span class="dot running-dot"></span>
        <span class="stat-label">Running</span>
        <span class="stat-value" id="count-running">0</span>
      </div>
      <div class="stat-chip failed" id="stat-failed">
        <span class="dot failed-dot"></span>
        <span class="stat-label">Failed</span>
        <span class="stat-value" id="count-failed">0</span>
      </div>
      <div class="stat-chip success" id="stat-success">
        <span class="dot success-dot"></span>
        <span class="stat-label">Success</span>
        <span class="stat-value" id="count-success">0</span>
      </div>
    </div>

    <div class="header-right">
      <span class="live-clock" id="live-clock"></span>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- ── TOOLBAR ────────────────────────────────────────── -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M16.5 16.5l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search pipelines…"
        aria-label="Search pipelines"
        autocomplete="off"
      />
    </div>

    <select id="status-filter" class="status-filter" aria-label="Filter by status">
      <option value="all">All Statuses</option>
      <option value="success">Success</option>
      <option value="failed">Failed</option>
      <option value="running">Running</option>
      <option value="unstable">Unstable</option>
    </select>

    <button class="btn-refresh" id="global-refresh" title="Refresh all">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.07 9A8 8 0 1 1 3 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Refresh
    </button>

    <span class="last-updated" id="last-updated">Last updated: —</span>
  </div>

  <!-- ── MAIN GRID ──────────────────────────────────────── -->
  <main class="main">
    <!-- Skeleton / loading state -->
    <div class="loading-overlay" id="loading-overlay" aria-live="polite" aria-label="Loading pipelines">
      <div class="spinner"></div>
      <span>Fetching pipeline data…</span>
    </div>

    <div class="pipeline-grid" id="pipeline-grid"></div>

    <!-- Empty state -->
    <div class="empty-state hidden" id="empty-state">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 15s1.5-2 4-2 4 2 4 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="9" y1="9" x2="9.01" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="15" y1="9" x2="15.01" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p>No pipelines match your search.</p>
    </div>
  </main>

  <!-- ── TOAST CONTAINER ───────────────────────────────── -->
  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- ── TILE TEMPLATE (cloned by JS) ──────────────────── -->
  <template id="tile-template">
    <article class="tile" tabindex="0" role="button" aria-label="Pipeline tile">
      <div class="tile-header">
        <div class="tile-status-dot"></div>
        <h2 class="tile-name"></h2>
        <button class="tile-refresh-btn" title="Refresh this pipeline" aria-label="Refresh pipeline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 4v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 20v-5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.07 9A8 8 0 1 1 3 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="tile-meta">
        <span class="tile-status-badge"></span>
        <span class="tile-build-number"></span>
      </div>

      <!-- progress bar visible only when running -->
      <div class="progress-wrap hidden">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <span class="progress-label"></span>
      </div>

      <div class="tile-stats">
        <div class="tile-stat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <polyline points="12 7 12 12 15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="tile-duration"></span>
        </div>
        <div class="tile-stat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span class="tile-updated"></span>
        </div>
      </div>

      <p class="tile-message hidden"></p>

      <div class="tile-branch">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="6" cy="6" r="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="18" cy="6" r="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M6 9v6M9 6h3a3 3 0 0 1 3 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="tile-branch-name"></span>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
